name: Mahmoud Tool - Offline Stable Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install PySide6 (The Correct Module)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 requests
        # تثبيت أي مكتبات إضافية مذكورة في المشروع
        Get-ChildItem -Recurse -Filter requirements.txt | ForEach-Object { pip install -r $_.FullName }

    - name: 4. Auto-Fix & Preparation
      shell: pwsh
      run: |
        # فك ضغط الملفات إذا كانت مضغوطة
        Get-ChildItem -Filter *.zip | ForEach-Object { Expand-Archive -Path $_.FullName -DestinationPath . -Force }
        
        # التأكد من وجود ملف main.py وتحديد مساره
        $mainFile = Get-ChildItem -Recurse -Filter main.py | Select-Object -First 1
        if (-not $mainFile) { Write-Error "Main script not found!"; exit 1 }
        echo "MAIN_PATH=$($mainFile.FullName)" >> $env:GITHUB_ENV

    - name: 5. Hard-Link Build (No Missing Files)
      run: |
        # --collect-all PySide6: هذا هو "المفتاح" الذي يضمن دمج المكتبة كاملة داخل الـ EXE
        # --hidden-import: نؤكد على النظام استدعاء المكتبة يدوياً لضمان عدم نسيانها
        pyinstaller --noconsole --onefile --clean --collect-all PySide6 --hidden-import PySide6.QtWidgets --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --name "Mahmoud_Global_Tool_Final" "${{ env.MAIN_PATH }}"

    - name: 6. Final Check
      shell: pwsh
      run: |
        if (Test-Path "dist/Mahmoud_Global_Tool_Final.exe") {
            Write-Host "Success: File is ready for offline use."
        } else {
            exit 1
        }

    - name: 7. Upload Official Release
      uses: actions/upload-artifact@v4
      with:
        name: Mahmoud-Tool-Final-Release
        path: dist/*.exe
        
