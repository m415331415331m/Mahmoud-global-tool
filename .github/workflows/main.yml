name: Mahmoud Tool - Optimized Professional Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install Requirements (Clean)
      run: |
        python -m pip install --upgrade pip
        # تثبيت المكاتب المطلوبة فقط لتقليل الحجم
        pip install pyinstaller PySide6 requests
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: 4. Technical Fix & Extraction
      shell: pwsh
      run: |
        # فك الضغط وتحديد الملف الرئيسي
        Get-ChildItem -Filter *.zip | ForEach-Object { Expand-Archive -Path $_.FullName -DestinationPath . -Force }
        $mainFile = Get-ChildItem -Recurse -Filter main.py | Select-Object -First 1
        echo "MAIN_PATH=$($mainFile.FullName)" >> $env:GITHUB_ENV

    - name: 5. Professional Build (Optimized Size)
      run: |
        # --exclude-module: استبعاد المكاتب الثقيلة التي لا يحتاجها برنامجك لتقليل الحجم
        # --collect-submodules: سحب الأجزاء المهمة فقط من PySide6
        pyinstaller --noconsole --onefile --clean `
        --exclude-module unittest `
        --exclude-module numpy `
        --exclude-module matplotlib `
        --exclude-module QtWebEngineWidgets `
        --hidden-import PySide6.QtWidgets `
        --hidden-import PySide6.QtCore `
        --hidden-import PySide6.QtGui `
        --name "Mahmoud_Global_Tool_Pro" "${{ env.MAIN_PATH }}"

    - name: 6. Upload Optimized EXE
      uses: actions/upload-artifact@v4
      with:
        name: Mahmoud-Tool-Pro-Release
        path: dist/*.exe
        
