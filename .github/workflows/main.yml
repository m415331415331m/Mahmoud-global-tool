name: Extract ZIP to Repository
on:
  workflow_dispatch: # تشغيل يدوي من الهاتف

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract ZIP
        run: |
          unzip MahmoudAITool_2026_COMPLETE.zip -d extracted_files/
          # حذف الملفات غير الضرورية لتقليل الفوضى
          rm -rf extracted_files/__MACOSX 

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-extracted project files for AI processing"
          git push
          
