name: Temporary Build Test (Validation)

on:
  workflow_dispatch: # للتشغيل اليدوي من الهاتف

jobs:
  validate-and-build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python_version: '3.11'

    - name: Install Verified Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow PySide6
        # محاولة تثبيت المكتبات من الملف الذي أنشأه Copilot
        if (Test-Path extracted_files/requirements.txt) { 
            pip install -r extracted_files/requirements.txt 
        }

    - name: Quick Build Test
      shell: pwsh
      run: |
        # التأكد من المسار الصحيح للملف الذي عدله Copilot
        cd extracted_files/MahmoudTool
        
        # أمر بناء سريع للتحقق من الصلاحية
        pyinstaller --onefile --noconsole --clean --uac-admin --name "Mahmoud_Test_Build" main.py

    - name: Upload Test Result
      uses: actions/upload-artifact@v3
      with:
        name: Temp-Validation-Build
        path: extracted_files/MahmoudTool/dist/*.exe
        
