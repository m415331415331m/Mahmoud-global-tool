name: Final Corrected Build 2026

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python_version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow PySide6
        if (Test-Path extracted_files/requirements.txt) { 
            pip install -r extracted_files/requirements.txt 
        }

    - name: Build Global Tool EXE
      shell: pwsh
      run: |
        # الدخول للمجلد الصحيح الذي يحتوي على الملفات المستخرجة
        cd extracted_files/MahmoudTool
        
        # بناء الملف بأعلى جودة واحترافية
        pyinstaller --onefile --noconsole --clean --uac-admin --name "Mahmoud_Global_Tool_Final" main.py

    - name: Upload Production Ready EXE
      uses: actions/upload-artifact@v4 # تم التحديث إلى v4 لحل مشكلة الصورة الأخيرة
      with:
        name: Mahmoud-Ultimate-Tool-2026
        path: extracted_files/MahmoudTool/dist/*.exe
        compression-level: 9 # لأفضل حجم وجودة ملف
        
