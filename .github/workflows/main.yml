name: Mahmoud Global Tool Builder - Ultra

on:
  workflow_dispatch: # للتشغيل اليدوي

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6
        # هنا نقوم بتثبيت أي مكتبات إضافية يستخدمها مشروعك
        # إذا كان لديك ملف requirements.txt سيعمل السطر التالي:
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Fix Missing Imports & Verify Code
      shell: pwsh
      run: |
        # هذا السطر يحل مشكلة QWidget التي ظهرت لك في الصورة بشكل آلي
        $file = "ui/widgets/device_card.py"
        if (Test-Path $file) {
            $content = Get-Content $file
            if (-not ($content -match "from PyQt6.QtWidgets import .*QWidget")) {
                $newImport = "from PyQt6.QtWidgets import QWidget, QLabel, QVBoxLayout, QHBoxLayout"
                $newImport + "`n" + $content | Set-Content $file
                Write-Host "Fixed QWidget import in $file"
            }
        }

    - name: Build EXE (The Final Tool)
      run: |
        # تحويل البرنامج مع تضمين كل الملفات والواجهات
        # --noconsole: لإخفاء الشاشة السوداء عند تشغيل البرنامج
        # --onefile: لجمع كل شيء في ملف EXE واحد
        # --collect-all: تضمن سحب كل ملفات PyQt6 بشكل كامل
        pyinstaller --noconsole --onefile --collect-all PyQt6 --name "MahmoudTool-Global-v1" main.py

    - name: Upload Finished Program
      uses: actions/upload-artifact@v4
      with:
        name: MahmoudTool-Final-Stable
        path: dist/MahmoudTool-Global-v1.exe
        
