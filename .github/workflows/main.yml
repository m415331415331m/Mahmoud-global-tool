name: Mahmoud Tool Ultimate - Zero Error Logic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. سحب الكود المصدري
      uses: actions/checkout@v4

    - name: 2. تهيئة بيئة بايثون (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. تثبيت المكتبات الأساسية والذكية
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 requests
        # البحث عن أي ملف requirements وتثبيته فوراً
        Get-ChildItem -Recurse -Filter requirements.txt | ForEach-Object { pip install -r $_.FullName }

    - name: 4. فحص الملفات وإصلاح الأخطاء البرمجية آلياً
      shell: pwsh
      run: |
        # فك ضغط أي ملفات ZIP موجودة لتجهيز الكود
        Get-ChildItem -Filter *.zip | ForEach-Object { Expand-Archive -Path $_.FullName -DestinationPath . -Force }

        # ميكانيكية الإصلاح الذاتي: البحث عن نقص استيراد QWidget في كل ملفات المشروع
        $pyFiles = Get-ChildItem -Recurse -Filter *.py
        foreach ($file in $pyFiles) {
            $content = Get-Content $file.FullName
            # إذا كان الملف يستخدم QWidget ولكنه لا يستوردها، نقوم بإضافتها
            if ($content -match "QWidget" -and $content -notmatch "from PyQt6.QtWidgets import .*QWidget") {
                $importLine = "from PyQt6.QtWidgets import QWidget, QLabel, QVBoxLayout, QHBoxLayout, QPushButton"
                $importLine + "`r`n" + $content | Set-Content $file.FullName
                Write-Host "✅ تم إصلاح نقص المكتبات في ملف: $($file.Name)"
            }
        }

    - name: 5. التحقق من وجود ملف التشغيل الرئيسي (Main Logic)
      id: locate_main
      shell: pwsh
      run: |
        $mainFile = Get-ChildItem -Recurse -Filter main.py | Select-Object -First 1
        if (-not $mainFile) {
            Write-Error "❌ خطأ فادح: لم يتم العثور على ملف main.py في أي مكان!"
            exit 1
        }
        echo "MAIN_PATH=$($mainFile.FullName)" >> $env:GITHUB_ENV
        Write-Host "🚀 تم تحديد الملف الرئيسي في: $($mainFile.FullName)"

    - name: 6. تحويل احترافي (EXE) مع دراسة بيئة التشغيل
      run: |
        # --collect-all PyQt6: يضمن أن كل ملفات DLL والصور الخاصة بالواجهة ستكون داخل الـ EXE
        # --clean: تنظيف الملفات المؤقتة لضمان نسخة نقية 100%
        pyinstaller --noconsole --onefile --clean --collect-all PyQt6 --name "Mahmoud_Global_Tool_Stable" "${{ env.MAIN_PATH }}"

    - name: 7. فحص الملف الناتج (Verification)
      shell: pwsh
      run: |
        if (Test-Path "dist/Mahmoud_Global_Tool_Stable.exe") {
            Write-Host "🏆 تم بناء الملف بنجاح وهو جاهز للتشغيل الآن."
        } else {
            Write-Error "⚠️ فشلت عملية التحويل في المرحلة النهائية."
            exit 1
        }

    - name: 8. رفع الملف النهائي للتحميل
      uses: actions/upload-artifact@v4
      with:
        name: Mahmoud-Tool-Official-Release
        path: dist/*.exe
        
