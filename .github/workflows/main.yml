name: Build MahmoudTool EXE from ZIP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Files
        shell: pwsh
        run: |
          # هذا الأمر سيبحث عن أي ملف مضغوط ويفكه تلقائياً مهما كان اسمه
          $zipFile = Get-ChildItem -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zipFile.FullName -DestinationPath "." -Force
          ls # للتأكد من ظهور ملف main.py بعد الفك

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build EXE
        run: |
          # تأكد أن الملف الأساسي داخل الزيب اسمه main.py
          pyinstaller --onefile --noconsole main.py

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: MahmoudTool-Final-EXE
          path: dist/*.exe
          
