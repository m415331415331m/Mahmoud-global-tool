name: Build MahmoudTool EXE from ZIP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Files
        shell: pwsh
        run: |
          # هنا نقوم بفك ضغط الملف (تأكد أن الاسم يطابق ملفك)
          Expand-Archive -Path "MahmoudTool.zip" -DestinationPath "." -Force
          ls # لعرض الملفات والتأكد من فكها

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          # تثبيت المكتبات من الملف المفكوك
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build EXE
        run: |
          # بناء البرنامج (تأكد أن الملف الأساسي اسمه main.py داخل الزيب)
          pyinstaller --onefile --noconsole main.py

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: MahmoudTool-Final-EXE
          path: dist/*.exe
          
